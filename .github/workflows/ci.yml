name: CI

# Runs on BOTH forges. It used to be guarded to the development forge, because the packages built
# against a core that existed only on an internal registry a public runner cannot reach. They now
# resolve `@green-tea/core` from npmjs.org, so that reason is gone and the guards are too.
#
# `contrib` is in both lists because external pull requests target it (CONTRIBUTING.md). Leaving it
# out is not a smaller version of running CI — it is none: a pull request against a branch that is
# not listed triggers nothing at all, so a contributor gets no signal and neither does whoever
# merges it.
#
# GitHub does not run workflows on pull requests from forks until a maintainer approves them, so a
# contributor's first push may sit with no checks for a while. That is not a rejection.
on:
  push:
    branches: [develop, main, contrib]
  pull_request:
    branches: [develop, main, contrib]

jobs:
  # Its own job so a missing sign-off reports on its own and costs nothing on push. Checks that the
  # trailer is present, not that it matches the author.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit needs a Signed-off-by
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$RANGE"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              echo "::error::no Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Fix the whole branch with: git rebase --signoff ${{ github.event.pull_request.base.sha }}"
            exit 1
          fi
          echo "All commits signed off."

  # Node 22 is the lowest `engines.node` any package declares (spec 2.5: build on the floor).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run complexity:check
      - run: npm run typecheck
      - run: npm test
      # No build step: JSR publishes `src/` and transpiles it. `deno publish --dry-run`, in the
      # `runtimes` job below, is what stands in for it — that is the publish path these packages
      # actually take.

  # A fixed matrix, not `fromJSON`: Gitea Actions support for a dynamic matrix was not verified. Each
  # entry runs only the packages whose engines name that runtime (scripts/run-runtime.mjs).
  runtimes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: npm run test:${{ matrix.runtime }}
      # Kept because it passed locally on Deno 2.9.6: `nodeModulesDir: manual` resolves core from the
      # tree `npm ci` installed, so JSR's checker never needs the version to exist on npm.
      - if: matrix.runtime == 'deno'
        run: deno publish --dry-run
